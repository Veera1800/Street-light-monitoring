{% extends 'base.html' %}
{% block content %}
<div id="alertBox"></div>

<div class="card shadow-sm">
  <div class="card-header bg-white">
    <ul class="nav nav-tabs card-header-tabs" id="authTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold" id="forgot-tab" data-bs-toggle="tab" data-bs-target="#forgot" type="button">Forgot Password</button>
      </li>
    </ul>
  </div>
  <div class="card-body p-4 tab-content">
    
    <!-- LOGIN FORM -->
    <div class="tab-pane fade show active" id="login">
      <h4 class="mb-3">Login to WCJ Portal</h4>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="Enter username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
      </div>
      <button class="btn btn-primary w-100" onclick="handleLogin()">Login</button>
    </div>

    <!-- REGISTER FORM -->
    <div class="tab-pane fade" id="register">
      <h4 class="mb-3">Create Account</h4>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="regUsername" class="form-control" placeholder="Choose a username">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="Enter email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Choose a password">
      </div>
      <button class="btn btn-success w-100" onclick="handleRegister()">Register</button>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div class="tab-pane fade" id="forgot">
      <h4 class="mb-3">Reset Password</h4>
      <div class="mb-3">
        <label class="form-label">Registered Email</label>
        <input type="email" id="forgotEmail" class="form-control" placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="forgotNewPassword" class="form-control" placeholder="Enter new password">
      </div>
      <button class="btn btn-warning w-100 text-dark" onclick="handleForgotPassword()">Reset Password</button>
    </div>

  </div>
</div>

<script>
  function showAlert(message, type) {
    document.getElementById('alertBox').innerHTML = `
      <div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
  }

  async function handleRegister() {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('regUsername').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      })
    });
    const data = await res.json();
    showAlert(data.message, res.ok ? 'success' : 'danger');
  }

  async function handleLogin() {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      window.location.href = '/dashboard';
    } else {
      showAlert(data.message, 'danger');
    }
  }

  async function handleForgotPassword() {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('forgotEmail').value,
        new_password: document.getElementById('forgotNewPassword').value
      })
    });
    const data = await res.json();
    showAlert(data.message, res.ok ? 'success' : 'danger');
  }
</script>
{% endblock %}
